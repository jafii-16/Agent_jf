<!DOCTYPE html>
<html>
<style>
    body{
        margin:0;
        height:100vh;
        display:grid;
        place-item:center;
        background:#09090b;
        color:white;
        font-family:arial;
    }

    .card{
        width:300px;
        padding:35px;
        text-align:center;
        background:#151518;
        border:1px solid #333;
        border-radius:25px;
    }
    .mic{
        width:90px;
        height:90px;
        border:0;
        border-radius:50px;
        font-size:35px;
        cursor:pointer
    }
    .status{
        margin-top:20px;
        color:#aaa;
    }
    .song{
        margin-top:10px;
        font-size:13px;
    }
    .listening{
        transform:scale(1.1);
        box-shawdow:0 0 0 10px #ffffff18;
    }
</style>

<head>
    <title>Nova AI</title>
</head>

<body>
    <div class="card">
        <h2> Nova AI </h2>
        <p> Say a song name </p>
        <button id="mic" class="mic"></button>

        <div id="status" class="status">
            Tap microphone
            </div>
        <div id ="song" class="song"></div>
    </div>

    <h1>🤖 Nova AI</h1>

    <h2>✅ Backend Connected Successfully</h2>

    <p>Flask server is running.</p>

</body>

</html>
